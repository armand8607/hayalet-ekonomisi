name: v2 kapilari

# NEDEN AYRI BIR IS AKISI
#
# `deploy.yml` ve `android.yml` yalnizca `main`'e push'ta kosar ve yalnizca
# `--self-test` calistirir -- o da v4.4'un VERI KATMANI kapisidir. Yani
# `scripts/v2/` altindaki motorun tamami, ve aktif gelistirmenin tamami, CI'da
# hic denenmiyordu.
#
# Bu, mekanizma eklendikce buyuyen bir riskti: B3 cekirdegin S/Q/T bloklarina,
# B4 uc ayri yerine dokundu. Her ikisinde de "on kapinin onu da birebir ayni
# cikti veriyor" diye elle dogrulandi -- ama bu ancak o gun Godot'u indirmis
# birinin yapabilecegi bir denetim. Regresyon korumasi bir insanin o anki
# kurulumuna bagli kalmamali.
#
# KAPILAR GERCEKTEN DUSEBILIYOR. Dogrulandi: `_dogrula`ya kasten `kosul=false`
# konulup kosuldu, `SONUC: 0 gecti, 7 kaldi` ve `rc=1` verdi. `main.gd`
# `get_tree().quit(cikis)` ile cikis kodunu tasiyor, yani yesil bir kapi
# gercekten bir sey iddia ediyor.
#
# BURADA OLMAYANLAR: `--kabul=N` ve `--yon-testleri=N` (v4.4'un agir parite
# kapilari, kampanya basina ~6 sn x 6 tohum). v4.4 DONDURULMUS ve v2 onun
# dosyalarina dokunmuyor, dolayisiyla her push'ta kosmalari gerekmiyor.
# Elle: `--kabul=1259`, `--yon-testleri=6`.

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  kapilar:
    name: Butun v2 kapilari
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Projeyi ice aktar
        run: |
          # `class_name` tasiyan scriptler `.godot/global_script_class_cache.cfg`
          # uzerinden cozulur ve onu yalnizca tarama kurar. Depoda `.godot/`
          # olmadigi icin bu adim SART; yoksa butun kapilar
          # "Identifier not declared" ile duser.
          cd godot
          godot --headless --import || true

      # --- v4.4 (dondurulmus motor -- yalnizca sizinti denetimi) -------------

      - name: 'v4.4: veri katmani'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --self-test

      - name: 'v4.4: Sim katmani duman testi'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --sim-test

      # --- v2 (aktif gelistirme) ---------------------------------------------
      #
      # Her kapi AYRI adim: dusen kapi is akisi ekraninda dogrudan gorunsun.
      # Tek adimda toplansalardi hangisinin dustugunu gormek icin log
      # karistirmak gerekirdi.
      #
      # SIRA UCUZDAN PAHALIYA. Erken dusen bir kapi 200 saniyelik dunya
      # kosusunu beklemeden geri bildirim versin.

      - name: 'B0/B1a: olcek degismezligi (23 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-olcek

      - name: 'B2a: uretim katmani (17 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-uretim

      - name: 'B2b: sinif kohortlari (13 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-nufus

      - name: 'B2c: mal piyasasi (7 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-mal

      - name: 'B1a: tarihsel kayit (1825-2023)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-tarih

      - name: 'B2: tarihsel kayit, iki mikro katman takili'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-tarih-mikro

      - name: 'B3: karanlik devlet ve bolunme (33 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-bolunme

      - name: 'B4: savas bir kriz cikisi olarak (16 denetim)'
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-savas

      - name: 'B1b: dunya katmani (17 denetim)'
        # En pahalisi (~220 sn): bes ulke x 198 yil x haftalik tik, birden
        # cok kampanya. En sona birakildi.
        run: cd godot && godot --headless res://scenes/Main.tscn -- --v2-dunya

  kahin:
    # AYRI IS, VE KAPSIZ BIR RUNNER'DA.
    #
    # `barichello/godot-ci:4.7` kabinda python3 YOK -- ilk kosuda bu adim
    # `exit 127` (command not found) ile dustu, on iki kapinin on ikisi de
    # gectikten sonra. Denetimin Godot'a zaten ihtiyaci olmadigi icin dogru
    # yer kabin ici degil; ayri is olarak paralel de kosar.
    name: Kahin turetilmis mi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 'Turetilmis Python dosyalari belgeyle ayni mi'
        run: |
          # `python/` ikilisi frozen markdown'daki kod bloklarindan URETILIR.
          # Elle duzenlenirlerse zincir belgeden kopar ve bunu fark etmenin
          # baska yolu yok.
          python3 tools/extract_sources.py --check
